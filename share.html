<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="作業員配置">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>作業員配置</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a1a;min-height:100vh}

.header{background:#fff;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.1);position:sticky;top:0;z-index:100;text-align:center}
.header .title{font-size:17px;font-weight:700}
.header .sub{font-size:13px;color:#6b7280;margin-top:4px}

.content{padding:12px;max-width:600px;margin:0 auto}

.site-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.site-name{font-size:16px;font-weight:700;color:#1a1a1a;margin-bottom:10px;display:flex;align-items:baseline;gap:6px}
.site-count{font-size:13px;font-weight:700;color:#1d6fcf}
.worker-tags{display:flex;flex-wrap:wrap;gap:8px}
.worker-tag{padding:7px 12px;background:#eff6ff;color:#1d6fcf;border-radius:20px;font-size:14px;font-weight:600}

.empty-state{text-align:center;padding:60px 20px;color:#9ca3af}
.empty-icon{font-size:48px;margin-bottom:12px}
.loading{text-align:center;padding:40px;color:#9ca3af;font-size:13px}

.date-select-wrap{margin-top:8px}
.date-select-wrap select{padding:8px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:13px;color:#1a1a1a;background:#fff;-webkit-appearance:none;max-width:220px}

.attach-toggle{margin-top:10px;padding:8px 10px;background:#f0f2f5;color:#374151;border:1.5px solid #e5e7eb;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;width:100%;text-align:left}
.attach-panel{display:none;margin-top:8px}
.attach-panel.show{display:block}
.attach-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-bottom:6px}
.attach-photo-grid a{display:block;border-radius:8px;overflow:hidden;border:1px solid #e5e7eb}
.attach-photo-grid img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.attach-doc-list{display:flex;flex-direction:column;gap:6px}
.attach-doc-item{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;font-size:12px;color:#374151;text-decoration:none}
</style>
</head>
<body>

<div class="header">
  <div class="title">🧑‍🔧 作業員配置</div>
  <div class="sub" id="date-label">読み込み中…</div>
  <div class="date-select-wrap">
    <select id="date-select" onchange="loadDate(this.value)"><option>読み込み中…</option></select>
  </div>
</div>

<div class="content" id="content">
  <div class="loading">読み込み中…</div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxaoCk1BJTOFXgbmU7nvT4GuX-bgdqH3UOUhPduwr_ngsvum50InXWs5KTyNRVUwAoD/exec';
// 現場情報管理システム(別アプリ)の現場情報(写真・書類など)を読み取り専用で参照する
const GENBA_GAS_URL = 'https://script.google.com/macros/s/AKfycby9b1XxHyum6h_k50ki3kFLDrauDAEXPXAq5GwzSXcr61A9DpvRlf5q3nLCYSYlO9_j/exec';

function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDateLabel(dateStr){
  try{
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const wd = ['日','月','火','水','木','金','土'][dt.getDay()];
    return m + '/' + d + '(' + wd + ')の配置';
  }catch(e){ return dateStr; }
}

function formatDateOption(dateStr){
  try{
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const wd = ['日','月','火','水','木','金','土'][dt.getDay()];
    return y + '/' + m + '/' + d + '(' + wd + ')';
  }catch(e){ return dateStr; }
}

let availableDates = [];

function fetchSiteTotals(){
  // 全期間の現場ごとの累計人工数(getSummaryを期間指定なしで呼ぶ代わりに広い範囲を指定)
  const from = '2000-01-01', to = '2100-12-31';
  return fetch(GAS_URL + '?action=getSummary&from=' + from + '&to=' + to)
    .then(r => r.json())
    .then(res => {
      const map = {};
      (res.totals || []).forEach(t => { map[t.name] = t.count; });
      return map;
    })
    .catch(() => ({}));
}

function driveThumbUrl(driveUrl){
  const m = String(driveUrl||'').match(/\/d\/([a-zA-Z0-9_-]+)/);
  return m ? ('https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w300') : '';
}

function fetchGenbaAttachments(){
  // 現場情報管理システムに登録されている写真・書類の一覧(現場名ごと)
  return fetch(GENBA_GAS_URL + '?action=getSites')
    .then(r => r.json())
    .then(res => {
      const map = {};
      (res.sites || []).forEach(s => {
        map[s.name] = {photos: s.photos || [], docs: s.docs || []};
      });
      return map;
    })
    .catch(() => ({}));
}

let attachSeq = 0;
function toggleAttach(id){
  document.getElementById(id).classList.toggle('show');
}

function renderAttachPanel(site, attachments){
  const info = attachments[site.name];
  if(!info || (info.photos.length === 0 && info.docs.length === 0)) return '';
  const id = 'attach-' + (attachSeq++);
  const photoGrid = info.photos.length === 0 ? '' : '<div class="attach-photo-grid">' +
    info.photos.map(p => '<a href="' + esc(p.url) + '" target="_blank"><img src="' + esc(driveThumbUrl(p.url)) + '" loading="lazy"></a>').join('') +
    '</div>';
  const docList = info.docs.length === 0 ? '' : '<div class="attach-doc-list">' +
    info.docs.map(d => '<a class="attach-doc-item" href="' + esc(d.url) + '" target="_blank">📄 ' + esc(d.name) + '</a>').join('') +
    '</div>';
  const label = '📎 写真・書類を見る(写真' + info.photos.length + '枚 / 書類' + info.docs.length + '件)';
  return '<button class="attach-toggle" onclick="toggleAttach(\'' + id + '\')">' + label + '</button>' +
    '<div class="attach-panel" id="' + id + '">' + photoGrid + docList + '</div>';
}

function loadDate(dateParam){
  const url = GAS_URL + '?action=getShareData' + (dateParam ? '&date=' + encodeURIComponent(dateParam) : '');
  document.getElementById('content').innerHTML = '<div class="loading">読み込み中…</div>';

  Promise.all([fetch(url).then(r => r.json()), fetchSiteTotals(), fetchGenbaAttachments()])
    .then(([res, siteTotals, attachments]) => {
      if(res.status !== 'ok'){
        document.getElementById('date-label').textContent = 'エラー';
        document.getElementById('content').innerHTML = '<div class="empty-state">読み込みに失敗しました</div>';
        return;
      }
      if(!res.date){
        document.getElementById('date-label').textContent = '';
        document.getElementById('content').innerHTML =
          '<div class="empty-state"><div class="empty-icon">📋</div>まだ配置データがありません</div>';
        return;
      }
      document.getElementById('date-label').textContent = formatDateLabel(res.date);
      const sel = document.getElementById('date-select');
      if(sel.value !== res.date) sel.value = res.date;
      const newUrl = location.pathname + '?date=' + encodeURIComponent(res.date);
      history.replaceState(null, '', newUrl);

      const sites = res.sites || [];
      if(sites.length === 0){
        document.getElementById('content').innerHTML =
          '<div class="empty-state"><div class="empty-icon">📋</div>この日の配置はまだありません</div>';
        return;
      }
      document.getElementById('content').innerHTML = sites.map(site => {
        const workers = site.workers || [];
        const tags = workers.map(w => '<span class="worker-tag">' + esc(w) + '</span>').join('');
        const total = siteTotals[site.name] || 0;
        return '<div class="site-card">'
          + '<div class="site-name"><span>🏗️ ' + esc(site.name) + '</span><span class="site-count">(累計' + total + '人工)</span></div>'
          + '<div class="worker-tags">' + tags + '</div>'
          + renderAttachPanel(site, attachments)
          + '</div>';
      }).join('');
    })
    .catch(() => {
      document.getElementById('date-label').textContent = 'エラー';
      document.getElementById('content').innerHTML = '<div class="empty-state">通信に失敗しました</div>';
    });
}

function loadDateList(selectedDate){
  fetch(GAS_URL + '?action=getAvailableDates')
    .then(r => r.json())
    .then(res => {
      availableDates = res.dates || [];
      const sel = document.getElementById('date-select');
      if(availableDates.length === 0){
        sel.innerHTML = '<option value="">(データなし)</option>';
        return;
      }
      sel.innerHTML = availableDates.map(d =>
        '<option value="' + esc(d) + '">' + esc(formatDateOption(d)) + '</option>'
      ).join('');
      if(selectedDate && availableDates.includes(selectedDate)) sel.value = selectedDate;
    })
    .catch(() => {
      document.getElementById('date-select').innerHTML = '<option value="">(取得失敗)</option>';
    });
}

window.onload = () => {
  const params = new URLSearchParams(location.search);
  const dateParam = params.get('date') || '';
  loadDateList(dateParam);
  loadDate(dateParam);
};
</script>
</body>
</html>
