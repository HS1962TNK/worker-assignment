<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="配置集計">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>作業員配置 集計</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a1a;min-height:100vh}

.header{background:#fff;padding:12px 16px;box-shadow:0 1px 4px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
.header .title{font-size:17px;font-weight:700}
.header .sub{font-size:11px;color:#888;margin-top:2px}

.content{padding:12px;max-width:600px;margin:0 auto}

.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.field{margin-bottom:10px}
label{font-size:12px;color:#6b7280;margin-bottom:4px;display:block;font-weight:500}
input[type=date],select{width:100%;padding:10px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;color:#1a1a1a;background:#fff;-webkit-appearance:none}
input:focus{outline:none;border-color:#1d6fcf}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.preset-btn{padding:6px 12px;background:#f0f2f5;color:#374151;border:1.5px solid #e5e7eb;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer}

.btn-run{width:100%;padding:12px;background:#1d6fcf;color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}
.btn-run:disabled{background:#93c5fd;cursor:not-allowed}

.result-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#fff;border-radius:10px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.result-row .name{font-size:14px;font-weight:600}
.result-row .count{font-size:15px;font-weight:700;color:#1d6fcf}
.result-total{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#1d6fcf;color:#fff;border-radius:10px;margin-top:10px;font-weight:700}

.empty-state{text-align:center;padding:40px 20px;color:#9ca3af}
.loading{text-align:center;padding:32px;color:#9ca3af;font-size:13px}
</style>
</head>
<body>

<div class="header">
  <div class="title">📊 作業員配置 集計</div>
  <div class="sub">現場ごとの延べ人数(人日)を期間で集計します</div>
</div>

<div class="content">
  <div class="card">
    <div class="row2">
      <div class="field">
        <label>開始日</label>
        <input type="date" id="from-input">
      </div>
      <div class="field">
        <label>終了日</label>
        <input type="date" id="to-input">
      </div>
    </div>
    <div class="preset-row">
      <button class="preset-btn" onclick="setPreset('thisMonth')">今月</button>
      <button class="preset-btn" onclick="setPreset('lastMonth')">先月</button>
      <button class="preset-btn" onclick="setPreset('thisYear')">今年</button>
      <button class="preset-btn" onclick="setPreset('lastYear')">去年</button>
      <button class="preset-btn" onclick="setPreset('all')">全期間</button>
    </div>
    <div class="field">
      <label>現場(絞り込み。選ぶとその現場内の作業員別の内訳が見られます)</label>
      <select id="site-input"><option value="">(全現場の合計を表示)</option></select>
    </div>
    <button class="btn-run" id="run-btn" onclick="runSummary()">集計する</button>
  </div>

  <div id="result"></div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxaoCk1BJTOFXgbmU7nvT4GuX-bgdqH3UOUhPduwr_ngsvum50InXWs5KTyNRVUwAoD/exec';

function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toDateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + day;
}

function setPreset(kind){
  const today = new Date();
  if(kind === 'thisMonth'){
    document.getElementById('from-input').value = toDateStr(new Date(today.getFullYear(), today.getMonth(), 1));
    document.getElementById('to-input').value = toDateStr(today);
  }else if(kind === 'lastMonth'){
    const lastMonthEnd = new Date(today.getFullYear(), today.getMonth(), 0);
    const lastMonthStart = new Date(today.getFullYear(), today.getMonth()-1, 1);
    document.getElementById('from-input').value = toDateStr(lastMonthStart);
    document.getElementById('to-input').value = toDateStr(lastMonthEnd);
  }else if(kind === 'thisYear'){
    document.getElementById('from-input').value = toDateStr(new Date(today.getFullYear(), 0, 1));
    document.getElementById('to-input').value = toDateStr(today);
  }else if(kind === 'lastYear'){
    document.getElementById('from-input').value = toDateStr(new Date(today.getFullYear()-1, 0, 1));
    document.getElementById('to-input').value = toDateStr(new Date(today.getFullYear()-1, 11, 31));
  }else if(kind === 'all'){
    document.getElementById('from-input').value = '2000-01-01';
    document.getElementById('to-input').value = toDateStr(new Date(today.getFullYear()+1, 11, 31));
  }
  runSummary();
}

window.onload = () => {
  setPreset('thisMonth');
  loadSiteOptions();
};

function loadSiteOptions(){
  fetch(GAS_URL + '?action=getRosterData')
    .then(r => r.json())
    .then(res => {
      const sites = (res.sites || []).map(s => s.name);
      const sel = document.getElementById('site-input');
      sites.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
      });
    })
    .catch(() => {});
}

function runSummary(){
  const from = document.getElementById('from-input').value;
  const to = document.getElementById('to-input').value;
  const site = document.getElementById('site-input').value;
  if(!from || !to) return;
  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  document.getElementById('result').innerHTML = '<div class="loading">集計中…</div>';

  let url = GAS_URL + '?action=getSummary&from=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to);
  if(site) url += '&site=' + encodeURIComponent(site);

  fetch(url)
    .then(r => r.json())
    .then(res => {
      if(res.status !== 'ok'){
        document.getElementById('result').innerHTML = '<div class="empty-state">' + esc(res.message || '集計に失敗しました') + '</div>';
        return;
      }
      const totals = res.totals || [];
      if(totals.length === 0){
        document.getElementById('result').innerHTML = '<div class="empty-state">この期間の配置データがありません</div>';
        return;
      }
      const icon = res.site ? '👷' : '🏗️';
      const heading = res.site
        ? '<div style="font-size:13px;font-weight:700;color:#374151;margin-bottom:8px">「' + esc(res.site) + '」の作業員別内訳</div>'
        : '';
      const rows = totals.map(t =>
        '<div class="result-row"><span class="name">' + icon + ' ' + esc(t.name) + '</span><span class="count">' + t.count + ' 人日</span></div>'
      ).join('');
      document.getElementById('result').innerHTML = heading + rows +
        '<div class="result-total"><span>合計</span><span>' + res.grandTotal + ' 人日</span></div>';
    })
    .catch(() => {
      document.getElementById('result').innerHTML = '<div class="empty-state">通信に失敗しました</div>';
    })
    .finally(() => { btn.disabled = false; });
}
</script>
</body>
</html>
